name: Build Vencord Mobile APK

on:
  push:
    branches: [ claude/vencord-k3x2uw ]
    paths:
      - 'vencord-mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'vencord-mobile/package-lock.json'

      - name: Install dependencies
        working-directory: vencord-mobile
        run: npm ci

      - name: Setup Expo token
        run: |
          echo "EXPO_TOKEN=${{ secrets.EXPO_TOKEN }}" >> $GITHUB_ENV

      - name: Setup Expo CLI
        run: npm install -g eas-cli expo-cli

      - name: Authenticate with EAS
        run: |
          echo "${{ secrets.EXPO_TOKEN }}" | eas login --non-interactive || true

      - name: Build APK with EAS
        working-directory: vencord-mobile
        run: |
          npx eas build \
            --platform android \
            --non-interactive \
            --wait \
            --output=vencord-mobile.apk

      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vencord-mobile-apk
          path: vencord-mobile/vencord-mobile.apk
          retention-days: 30

      - name: Create Release
        uses: actions/create-release@v1
        if: startsWith(github.ref, 'refs/heads/claude/vencord-k3x2uw')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          release_name: Vencord Mobile v1.0.0 Build ${{ github.run_number }}
          body: |
            ## Vencord Mobile APK Release

            ### Features
            - MessageLogger Plugin v1.0.0
            - Full edit history tracking (Vencord-style)
            - Message deletion logging
            - JSON/CSV export

            ### How to Install
            1. Download `vencord-mobile.apk`
            2. Enable "Unknown sources" in Android settings
            3. Install the APK file
            4. Open and enter your Discord token

            ⚠️ **Security Warning**: Never share your Discord token with anyone!
          draft: false
          prerelease: true

      - name: Upload to Release
        uses: actions/upload-release-asset@v1
        if: startsWith(github.ref, 'refs/heads/claude/vencord-k3x2uw')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: vencord-mobile/vencord-mobile.apk
          asset_name: vencord-mobile.apk
          asset_content_type: application/vnd.android.package-archive
