name: Build Vencord Mobile APK

on:
  push:
    branches: [ claude/vencord-k3x2uw ]
    paths:
      - 'vencord-mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'vencord-mobile/package-lock.json'

      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: vencord-mobile
        run: npm ci

      - name: Prebuild for Android
        working-directory: vencord-mobile
        run: |
          npm install -g expo-cli
          npx expo prebuild --platform android --clean

      - name: Build APK
        working-directory: vencord-mobile
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Rename APK
        working-directory: vencord-mobile/android/app/build/outputs/apk/release
        run: |
          mv app-release-unsigned.apk vencord-mobile.apk || mv app-release.apk vencord-mobile.apk || true
          ls -la

      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vencord-mobile-apk
          path: vencord-mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: 'warn'
          retention-days: 30

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          release_name: Vencord Mobile v1.0.0 Build ${{ github.run_number }}
          body: |
            ## Vencord Mobile APK Release

            ### Features
            - MessageLogger Plugin v1.0.0
            - Full edit history tracking (Vencord-style)
            - Message deletion logging
            - JSON/CSV export

            ### How to Install
            1. Download `vencord-mobile.apk`
            2. Enable "Unknown sources" in Android settings
            3. Install the APK file
            4. Open and enter your Discord token

            ⚠️ **Security Warning**: Never share your Discord token with anyone!
          draft: false
          prerelease: true

      - name: Upload to Release
        uses: actions/upload-release-asset@v1
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: vencord-mobile/android/app/build/outputs/apk/release/vencord-mobile.apk
          asset_name: vencord-mobile-v1.0.0.apk
          asset_content_type: application/vnd.android.package-archive
