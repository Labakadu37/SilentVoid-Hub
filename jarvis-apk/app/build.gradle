apply plugin: 'com.android.application'

android {
    namespace 'com.silentvoid.jarvis'
    compileSdk 34

    defaultConfig {
        applicationId "com.silentvoid.jarvis"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
}
