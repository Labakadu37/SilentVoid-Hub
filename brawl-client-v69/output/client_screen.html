<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SilentVoid Client v69.0.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
        }
        .screen {
            width: 1280px;
            height: 720px;
            background: linear-gradient(135deg, #1a0a2e 0%, #0d1b2a 30%, #1b2838 60%, #0a192f 100%);
            position: relative;
            overflow: hidden;
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.1), inset 0 0 60px rgba(0, 0, 0, 0.5);
        }
        .screen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(circle at 20% 80%, rgba(0, 255, 136, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 215, 0, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }
        .grid {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        .watermark {
            position: absolute;
            bottom: 10px;
            right: 15px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 11px;
            font-family: monospace;
        }
        .status-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: rgba(0, 0, 0, 0.6);
            border-top: 1px solid rgba(0, 255, 136, 0.2);
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-family: monospace;
            font-size: 11px;
            color: rgba(0, 255, 136, 0.6);
            gap: 20px;
        }
        .dot {
            width: 6px; height: 6px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 6px #00ff88;
        }
    </style>
</head>
<body>
    <div class="screen">
        <div class="grid"></div>
        
            <div style="
                position: absolute;
                left: 20px;
                top: 20px;
                font-size: 32px;
                color: #FFFFFF;
                font-family: 'Supercell-Magic', 'Lilita One', 'Impact', sans-serif;
                font-weight: bold;
                text-shadow: 2px 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.5);
                letter-spacing: 1px;
            ">SilentVoid Client v69</div>
            <div style="
                position: absolute;
                left: 20px;
                top: 60px;
                font-size: 18px;
                color: #00FF88;
                font-family: 'Supercell-Magic', 'Lilita One', 'Impact', sans-serif;
                font-weight: bold;
                text-shadow: 2px 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.5);
                letter-spacing: 1px;
            ">Framework indépendant</div>
            <div style="
                position: absolute;
                left: 20px;
                top: 85px;
                font-size: 18px;
                color: #FFD700;
                font-family: 'Supercell-Magic', 'Lilita One', 'Impact', sans-serif;
                font-weight: bold;
                text-shadow: 2px 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.5);
                letter-spacing: 1px;
            ">Brawl Stars Client Mod</div>
            <div style="
                position: absolute;
                left: 20px;
                top: 120px;
                font-size: 16px;
                color: #00CCFF;
                font-family: 'Supercell-Magic', 'Lilita One', 'Impact', sans-serif;
                font-weight: bold;
                text-shadow: 2px 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.5);
                letter-spacing: 1px;
            ">Statut: Connecté</div>
        <div class="status-bar">
            <div class="dot"></div>
            <span>SilentVoid Framework v69.0.0</span>
            <span>|</span>
            <span>Brawl Stars Client</span>
            <span>|</span>
            <span>1280x720</span>
            <span>|</span>
            <span>Framework indépendant</span>
        </div>
        <div class="watermark">SilentVoid-Hub</div>
    </div>
</body>
</html>
